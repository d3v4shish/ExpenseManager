[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-manager-pyqt"
version = "0.1.0"
description = "Standalone PyQt expense manager extracted from noc_dashboard_pyqt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.6",
  "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
